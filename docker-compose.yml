version: '3.8'

services:
  vulcantech-edge-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vulcantech_edge_predictor
    restart: always
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1